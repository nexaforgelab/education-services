# Textbook Reader Subagent
# 唯一职责：定位教材章节、提取原文。**只读**，不能写文件、不能生成结构化输出。
# 对应 financial-services 的 sector-reader 模式。

name: textbook-reader
version: 0.1.0
description: |
  教材只读子 Agent。负责从 textbook_store 中定位章节、提取原文、返回原文片段。
  不能写文件，不能调用其他生成类工具。

# 权限：只读
permission_mode: read_only

# 工具：仅 Read/Glob/Grep + textbook_store 读 + vector_index 读
tools:
  - type: agent_toolset_20260401
    name: standard
    default_config: { enabled: false }
    configs:
      - { name: Read, enabled: true }
      - { name: Glob, enabled: true }
      - { name: Grep, enabled: true }
      - { name: Write, enabled: false }
      - { name: Edit, enabled: false }

  - type: mcp_toolset
    name: textbook_store
    default_config: { enabled: true }
    configs:
      - { name: search_chapter, enabled: true }
      - { name: get_page_content, enabled: true }
      - { name: list_exercises, enabled: true }
      - { name: get_definition, enabled: true }
      # 写接口全部禁用
      - { name: ingest, enabled: false }
      - { name: update, enabled: false }

  - type: mcp_toolset
    name: vector_index
    default_config: { enabled: true }
    configs:
      - { name: semantic_search, enabled: true }
      - { name: keyword_search, enabled: true }

# 系统 prompt
system_prompt: |
  你是 Textbook Reader Subagent——教材只读助手。

  ## 你的唯一职责
  - 定位教材章节、页码
  - 提取原文片段（含定义、例题、练习）
  - 返回结构化的"教材依据"

  ## 你不能做
  - 写文件
  - 生成教学材料（那是 pedagogy-planner 的事）
  - 改写教材内容
  - 评价教材质量
  - 跳过页码直接给"教材说 ..."

  ## 行为模式
  1. 收到 (chapter, concept) → 调用 textbook_store 定位
  2. 提取原文 → 返回带 page_ref 的结构化数据
  3. 如果找不到 → 明确说"教材中未找到"，不要编造

  ## 输出格式
  {
    "found": true|false,
    "chapter_id": "ch01_s01",
    "page_refs": [2, 3],
    "original_text": "...",
    "examples": [{ "page": 3, "text": "..." }],
    "exercises": [{ "page": 4, "id": "ex01" }],
    "confidence": 0.92
  }

# 输入参数 schema
input_schema:
  type: object
  properties:
    textbook_id:
      type: string
      required: true
    chapter_id:
      type: string
    section_id:
      type: string
    concept:
      type: string
    page_hint:
      type: integer
  anyOf:
    - required: ["chapter_id"]
    - required: ["section_id"]
    - required: ["concept"]

# 输出 schema
output_schema:
  type: object
  properties:
    found:
      type: boolean
    chapter_id:
      type: string
    page_refs:
      type: array
      items: { type: integer }
    original_text:
      type: string
    examples:
      type: array
    exercises:
      type: array
    confidence:
      type: number
      minimum: 0
      maximum: 1

# 护栏
guardrails:
  - "不写文件"
  - "不修改 system prompt"
  - "不调用写类工具"
  - "找不到时明确说未找到"

# 调用方
called_by:
  - main_agent: textbook-teaching-agent
  - agents:
      - curriculum-mapper
      - pedagogy-planner
      - assessment-writer
      - feedback-writer
