name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible.

  - type: dropdown
    id: type
    attributes:
      label: Feature Type
      description: What kind of feature is this?
      options:
        - New Agent
        - New Skill
        - New Slash Command
        - New Plugin (vertical)
        - Backend / API enhancement
        - New subject (e.g. physics, history)
        - Tooling / DX
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Primary Audience
      description: Who benefits most from this feature?
      options:
        - Teacher
        - Parent
        - Student
        - School administrator
        - Developer / Maintainer
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: |
        As a [teacher/parent/student], I want to [do something] so that [outcome].
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like to see this implemented?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you considered?
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Example Usage
      description: Show how this feature would be used (commands, API calls, etc.)
      placeholder: |
        /new-command <arg1> <arg2>
        # or
        POST /api/v1/...
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: This feature aligns with the project's goal of textbook-driven tutoring
          required: true
        - label: I am willing to submit a PR for this feature
          required: false
