name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml --break-system-packages

      - name: Run validate
        run: |
          python scripts/validate.py

      - name: Check skill sync
        run: |
          python scripts/sync-agent-skills.py --check

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: education
          POSTGRES_PASSWORD: education
          POSTGRES_DB: education_services_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt --break-system-packages
          pip install pytest pytest-asyncio httpx --break-system-packages

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://education:education@localhost:5432/education_services_test
          ENV: test
        run: |
          pytest -v

  eval-agent:
    name: Agent Evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml --break-system-packages

      - name: Run evals
        run: |
          python scripts/eval_agent.py --all

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff --break-system-packages

      - name: Run ruff
        run: ruff check backend/ scripts/

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [validate, test-backend, eval-agent, lint]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          tags: education-services:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
