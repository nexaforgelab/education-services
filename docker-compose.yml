# Education Services — Docker Compose
# 启动 PostgreSQL + pgvector + MinIO + Backend

version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: education
      POSTGRES_PASSWORD: education
      POSTGRES_DB: education_services
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://education:education@postgres:5432/education_services
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: education-services
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TEXTBOOK_MCP_URL: http://backend:8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio
    volumes:
      - ./out:/app/out
      - ./uploads:/app/uploads

volumes:
  pgdata:
  miniodata:
